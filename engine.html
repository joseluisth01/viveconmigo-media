<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Fraunces; src: url(assets/fraunces-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-style: normal; }
@font-face { font-family: Fraunces; src: url(assets/fraunces-latin-wght-italic.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }
@font-face { font-family: Inter; src: url(assets/inter-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Inter; src: url(assets/inter-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Inter; src: url(assets/inter-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
html, body { margin: 0; padding: 0; }
#stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: Inter, sans-serif; background: #1F1B16; }
/* zona segura: arriba 260px (UI TikTok), abajo 420px (texto/descr.), derecha 160px (botones) */
.scene { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; justify-content: center; padding: 260px 160px 420px 96px; box-sizing: border-box; }
.serif { font-family: Fraunces, Georgia, serif; font-weight: 400; letter-spacing: -3px; }
.it { font-style: italic; }
.el { position: relative; z-index: 1; will-change: transform, opacity; }
.label { font-size: 34px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; }
.big { position: absolute; right: -40px; bottom: 260px; font-family: Fraunces, serif; font-weight: 600; font-size: 900px; line-height: .8; opacity: .14; letter-spacing: -20px; z-index: 0; }
.bar { display: flex; gap: 14px; margin-bottom: 80px; }
.bar span { flex: 1; height: 12px; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; }
.bubble { font-size: 50px; font-weight: 500; line-height: 1.3; padding: 34px 48px; border-radius: 48px; max-width: 720px; box-shadow: 0 30px 60px -30px rgba(31,27,22,.4); }
.chip { font-size: 44px; font-weight: 500; padding: 24px 40px; border-radius: 99px; }
.card { background: #FFFFFF; color: #1F1B16; border-radius: 56px; padding: 60px; display: flex; flex-direction: column; gap: 40px; box-shadow: 0 40px 80px -40px rgba(31,27,22,.45); }
.col { flex: 1; border-radius: 40px; padding: 44px 40px; display: flex; flex-direction: column; gap: 30px; }
.col h4 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; }
.col p { margin: 0; font-size: 42px; line-height: 1.25; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ---------- Paleta de marca ---------- */
const C = { cream: '#FAF7F2', ink: '#1F1B16', terra: '#C75B3C', olive: '#6B7A4F', sand: '#F1E6D6', rust: '#A6462A', peach: '#E58A6D', butter: '#F3E3BF', blush: '#FBE7DF', stone: '#CFC6B8', grey: '#5E564C' };
const THEMES = {
  cream: { bg: C.cream, fg: C.ink, accent: C.terra, soft: C.grey },
  ink:   { bg: C.ink,   fg: C.cream, accent: C.peach, soft: C.stone },
  terra: { bg: C.terra, fg: C.cream, accent: C.butter, soft: C.blush },
  olive: { bg: C.olive, fg: C.cream, accent: C.butter, soft: C.butter },
  sand:  { bg: C.sand,  fg: C.ink,   accent: C.terra, soft: C.grey },
  rust:  { bg: C.rust,  fg: C.cream, accent: C.butter, soft: C.blush },
};
const SPEC = window.SPEC;
const $stage = document.getElementById('stage');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
/* *texto* -> cursiva en color de acento */
const rich = (s, accent) => esc(s).replace(/\*(.+?)\*/g, `<span class="it" style="color:${accent}">$1</span>`);

const FLAG = '<svg width="64" height="76" viewBox="0 0 64 76"><rect x="4" y="2" width="7" height="72" rx="3.5" fill="currentColor"/><path d="M11 6 C24 0 34 12 60 6 L52 24 L60 42 C34 48 24 36 11 42 Z" fill="currentColor"/></svg>';

/* ---------- Construcción de escenas ---------- */
const anims = []; // {el, t0, kind, opts}
const scenes = [];
let T = 0;
const items = SPEC.scenes.filter((s) => s.type === 'item');

SPEC.scenes.forEach((s, idx) => {
  const th = THEMES[s.theme || 'cream'];
  const sec = document.createElement('section');
  sec.className = 'scene';
  sec.style.background = th.bg; sec.style.color = th.fg;
  if (s.align === 'center') { sec.style.alignItems = 'center'; sec.style.textAlign = 'center'; sec.style.padding = '260px 96px 420px'; }
  $stage.appendChild(sec);
  const start = T, dur = s.dur || 3;
  scenes.push({ el: sec, a: start, b: start + dur, fast: s.type === 'item' });
  T += dur;
  const add = (html, kind, at, opts = {}) => {
    const d = document.createElement('div'); d.className = 'el'; d.innerHTML = html;
    if (opts.style) d.setAttribute('style', opts.style);
    (opts.parent || sec).appendChild(d);
    anims.push({ el: d, t0: start + at, kind, opts });
    return d;
  };
  let t = 0.1;
  const step = s.step || 0.55;

  switch (s.type) {
    case 'hook':
    case 'text': {
      sec.style.gap = (s.gap || 40) + 'px';
      if (s.label) { add(`<div class="label" style="color:${th.accent}">${esc(s.label)}</div>`, 'rise', t, { dist: 40 }); t += 0.25; }
      if (s.flags) { add(`<div style="display:flex;gap:18px;color:${th.accent}">${FLAG.repeat(s.flags)}</div>`, 'pop', t, { rot: -8 }); t += 0.3; }
      for (const l of s.lines) {
        const size = l.size || (s.type === 'hook' ? 132 : 104);
        const fam = l.sans ? 'font-family:Inter,sans-serif;font-weight:500;letter-spacing:0' : '';
        const color = l.accent ? th.accent : (l.soft ? th.soft : 'inherit');
        const html = `<div class="${l.sans ? '' : 'serif'} ${l.it ? 'it' : ''}" style="font-size:${size}px;line-height:${l.sans ? 1.3 : 1.05};color:${color};${fam}">${rich(l.t, th.accent)}</div>`;
        add(html, l.pop ? 'pop' : 'rise', t, { rot: -4, dist: 90 });
        t += l.wait || step;
      }
      break;
    }
    case 'item': {
      const n = items.indexOf(s) + 1, total = items.length;
      const big = document.createElement('div'); big.className = 'big'; big.textContent = n; sec.appendChild(big);
      anims.push({ el: big, t0: start, kind: 'bigrise' });
      const light = ['cream', 'sand'].includes(s.theme);
      const track = light ? 'rgba(31,27,22,.18)' : 'rgba(250,247,242,.25)', fill = light ? C.ink : C.cream;
      const bar = add(`<div class="bar">${Array.from({ length: total }, (_, k) => `<span style="background:${track}"><i data-k="${k}" style="background:${fill}"></i></span>`).join('')}</div>`, 'none', 0);
      anims.push({ el: bar, t0: start, kind: 'bar', opts: { n, dur } });
      add(`<div class="serif" style="font-size:${s.size || 116}px;line-height:1.05">${rich(s.title, th.accent)}</div>`, 'slide', 0.08);
      if (s.sub) add(`<div style="font-size:52px;line-height:1.3;margin-top:50px;color:${th.soft}">${rich(s.sub, th.accent)}</div>`, 'rise', 0.75, { dist: 50 });
      break;
    }
    case 'chat': {
      sec.style.gap = '34px';
      if (s.label) { add(`<div class="label" style="color:${th.accent};margin-bottom:16px">${esc(s.label)}</div>`, 'rise', t, { dist: 40 }); t += 0.3; }
      for (const m of s.msgs) {
        const me = m.from === 'me';
        const bg = me ? C.terra : (th.bg === C.cream ? '#FFFFFF' : C.cream);
        const fg = me ? C.cream : C.ink;
        const d = add(`<div class="bubble" style="background:${bg};color:${fg}">${rich(m.t, me ? C.butter : C.terra)}</div>`, 'pop', t, { rot: me ? 4 : -4, style: `align-self:${me ? 'flex-end' : 'flex-start'}` });
        t += m.wait || 0.75;
      }
      break;
    }
    case 'versus': {
      sec.style.gap = '50px';
      if (s.title) { add(`<div class="serif" style="font-size:${s.size || 92}px;line-height:1.05">${rich(s.title, th.accent)}</div>`, 'rise', t); t += 0.5; }
      const row = add('', 'none', 0, { style: 'display:flex;gap:28px' });
      const colHtml = (side, bg, fg, hc) => `<h4 style="color:${hc}">${esc(side.label)}</h4>` + side.items.map((x) => `<p>${rich(x, hc)}</p>`).join('');
      const L = add(colHtml(s.left, null, null, s.leftColor || C.grey), 'rise', t, { parent: row, style: `flex:1;border-radius:40px;padding:44px 40px;display:flex;flex-direction:column;gap:30px;background:${th.bg === C.ink ? '#2B2620' : '#FFFFFF'};color:${th.bg === C.ink ? C.stone : C.ink}` });
      L.className = 'el col';
      const R = add(colHtml(s.right, null, null, C.butter), 'rise', t + 0.9, { parent: row, style: `flex:1;border-radius:40px;padding:44px 40px;display:flex;flex-direction:column;gap:30px;background:${C.olive};color:${C.cream}` });
      R.className = 'el col';
      break;
    }
    case 'profile': {
      sec.style.gap = '50px';
      if (s.title) { add(`<div class="serif" style="font-size:${s.size || 96}px;line-height:1.05">${rich(s.title, th.accent)}</div>`, 'rise', t); t += 0.4; }
      const circ = 440;
      const card = add(`<div class="card">
        <div style="display:flex;align-items:center;gap:44px">
          <div style="position:relative;width:220px;height:220px;flex-shrink:0">
            <svg width="220" height="220" viewBox="0 0 168 168"><circle cx="84" cy="84" r="70" fill="none" stroke="#EFE6D8" stroke-width="16"/>
            <circle class="ring" cx="84" cy="84" r="70" fill="none" stroke="${C.olive}" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 ${circ}" transform="rotate(-90 84 84)"/></svg>
            <span class="pct serif" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:500;letter-spacing:-2px">0%</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:54px;font-weight:600">${esc(s.name)}</span><span style="font-size:36px;color:${C.grey}">${esc(s.tag)}</span></div>
        </div>
        ${(s.rows || []).map((r) => `<div class="row" style="font-size:40px;line-height:1.35;opacity:0"><b style="color:${r.good ? '#4F5C37' : C.rust}">${esc(r.k)}</b> ${esc(r.v)}</div>`).join('')}
      </div>`, 'rise', t, { dist: 160, dur: 0.6 });
      anims.push({ el: card, t0: start + t + 0.4, kind: 'ring', opts: { pct: s.pct, circ } });
      card.querySelectorAll('.row').forEach((r, k) => anims.push({ el: r, t0: start + t + 2.0 + k * 0.5, kind: 'rise', opts: { dist: 40 } }));
      add(`<div style="font-size:30px;color:${th.soft}">Perfil de ejemplo</div>`, 'rise', t + 2.4, { dist: 20 });
      break;
    }
    case 'chips': {
      sec.style.gap = '44px';
      if (s.label) { add(`<div class="label" style="color:${th.accent}">${esc(s.label)}</div>`, 'rise', t, { dist: 40 }); t += 0.2; }
      add(`<div class="serif" style="font-size:${s.size || 96}px;line-height:1.06">${rich(s.title, th.accent)}</div>`, 'rise', t); t += 1.0;
      const wrap = add('', 'none', 0, { style: 'display:flex;flex-wrap:wrap;gap:22px' });
      const pal = [[C.ink, C.cream], [C.olive, C.cream], [C.sand, C.ink], [C.terra, C.cream], [C.rust, C.cream], [C.butter, C.ink]];
      s.chips.forEach((c, k) => { const [b, f] = pal[k % pal.length]; add(`<span class="chip" style="display:inline-block;background:${b};color:${f}">${esc(c)}</span>`, 'pop', t + k * 0.25, { parent: wrap, rot: k % 2 ? 4 : -4 }); });
      t += s.chips.length * 0.25 + 0.4;
      if (s.foot) add(`<div style="font-size:50px;font-weight:600">${rich(s.foot, th.accent)}</div>`, 'rise', t, { dist: 40 });
      break;
    }
    case 'cta': {
      sec.style.alignItems = 'center'; sec.style.textAlign = 'center'; sec.style.padding = '200px 96px 380px'; sec.style.gap = '60px';
      add(`<img src="assets/logo.png" style="width:240px;height:240px;border-radius:60px">`, 'pop', 0.1);
      add(`<div class="serif" style="font-size:${s.size || 112}px;line-height:1.04">${rich(s.title, th.fg === C.cream ? C.cream : th.accent).replace('style="color:' + C.cream + '"', '')}</div>`, 'rise', 0.5);
      add(`<div style="background:${C.cream};color:${C.ink};font-size:62px;font-weight:600;padding:34px 72px;border-radius:999px">vive-conmigo.es</div>`, 'pop', 1.1);
      add(`<div style="font-size:42px;color:${th.soft}">${esc(s.foot || 'Gratis · Link en el perfil')}</div>`, 'rise', 1.6, { dist: 40 });
      break;
    }
  }
});
window.DURATION = T;

/* ---------- Animación determinista ---------- */
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

window.render = function (t) {
  for (const s of scenes) {
    const vis = t >= s.a && (t < s.b || s === scenes[scenes.length - 1]);
    const inP = easeOut((t - s.a) / (s.fast ? 0.12 : 0.25));
    const outP = s === scenes[scenes.length - 1] ? 0 : easeOut((t - (s.b - 0.25)) / 0.25);
    s.el.style.opacity = vis ? (s.fast ? 1 : Math.min(inP, 1 - outP)) : 0;
    s.el.style.transform = vis ? (s.fast ? `scale(${1.06 - 0.06 * inP})` : `translateY(${-outP * 120}px)`) : 'none';
  }
  for (const a of anims) {
    const o = a.opts || {};
    if (a.kind === 'rise') { const p = easeOut((t - a.t0) / (o.dur || 0.45)); a.el.style.opacity = p; a.el.style.transform = `translateY(${(1 - p) * (o.dist || 80)}px)`; }
    else if (a.kind === 'pop') { const p = clamp((t - a.t0) / 0.42), s = easeBack(p); a.el.style.opacity = clamp(p * 2.5); a.el.style.transform = `scale(${0.6 + 0.4 * s}) rotate(${(o.rot || 0) * (1 - p)}deg)`; }
    else if (a.kind === 'slide') { const p = easeOut((t - a.t0) / 0.35); a.el.style.opacity = p; a.el.style.transform = `translateX(${(1 - p) * -140}px)`; }
    else if (a.kind === 'bigrise') { a.el.style.transform = `translateY(${(1 - easeOut((t - a.t0) / 0.6)) * 200}px)`; }
    else if (a.kind === 'bar') { a.el.querySelectorAll('i').forEach((el) => { const k = +el.dataset.k + 1; el.style.width = k < o.n ? '100%' : k > o.n ? '0%' : (100 * clamp((t - a.t0) / o.dur)) + '%'; }); }
    else if (a.kind === 'ring') { const k = easeOut((t - a.t0) / 1.4), pct = Math.round(o.pct * k); a.el.querySelector('.ring').setAttribute('stroke-dasharray', `${(o.circ * pct / 100).toFixed(1)} ${o.circ}`); a.el.querySelector('.pct').textContent = pct + '%'; }
  }
};
window.render(0);
</script>
</body>
</html>
